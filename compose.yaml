name: student-marketplace

x-runtime-environment: &runtime-environment
  - DATABASE_URL=${DATABASE_URL:?Set private matching PostgreSQL DATABASE_URL}
  - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set private JWT_SECRET_KEY}
  - FRONTEND_ORIGINS=${FRONTEND_ORIGINS:?Set explicit JSON frontend origins}
  - APP_ENV=${APP_ENV:-development}
  - REFRESH_COOKIE_SECURE=${REFRESH_COOKIE_SECURE:-false}
  - UPLOAD_DIR=/data/uploads
  - SMTP_HOST
  - SMTP_PORT
  - SMTP_USERNAME
  - SMTP_PASSWORD
  - SMTP_FROM_EMAIL
  - SMTP_SECURITY

services:
  db:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set PostgreSQL database name}
      POSTGRES_USER: ${POSTGRES_USER:?Set PostgreSQL role name}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set private PostgreSQL password}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  uploads-init:
    image: ${MARKETPLACE_IMAGE:-student-marketplace:local}
    pull_policy: never
    user: "0:0"
    command: [python, -m, backend.compose_runtime, prepare-uploads]
    volumes:
      - uploads:/data/uploads
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    restart: "no"

  migrate:
    image: ${MARKETPLACE_IMAGE:-student-marketplace:local}
    pull_policy: never
    command: [python, -m, backend.compose_runtime, migrate]
    environment: *runtime-environment
    depends_on:
      db:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    restart: "no"

  app:
    build: .
    image: ${MARKETPLACE_IMAGE:-student-marketplace:local}
    command: [python, -m, backend.compose_runtime, serve]
    environment: *runtime-environment
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      uploads-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -m, backend.compose_runtime, probe]
      interval: 5s
      timeout: 6s
      retries: 12
      start_period: 10s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp:size=16777216]
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
