name: Disposable isolation and capacity 101
on:
  push:
    branches: [issue-101-isolation-capacity]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: disposable101-${{ github.ref }}
  cancel-in-progress: false
jobs:
  rehearsal:
    if: github.repository == '240103098-code/Student_marketplace' && (github.ref == 'refs/heads/issue-101-isolation-capacity' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.13.15
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Install locked test tools and private browser trust utility
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libnss3-tools
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.lock
          npm ci --prefix e2e --ignore-scripts --no-audit --no-fund
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/marketplace101-browsers" node e2e/node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Run guarded controller and actual Linux phases
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/marketplace101-browsers
        run: .venv/bin/python -m tools.rehearsal101 --confirm-disposable issue-101-synthetic-only
      - name: Publish only constructed safe summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rehearsal101-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: rehearsal101-safe/summary.json
