name: Issue 59 Compose verification
on:
  push:
    branches: [issue-59-compose]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install isolated browser driver
        run: npm install --prefix "$RUNNER_TEMP/compose-browser" --ignore-scripts --no-audit --no-fund playwright@1.62.1
      - name: Build and verify actual Compose services
        env:
          CONTAINER_PLAYWRIGHT_MODULE: ${{ runner.temp }}/compose-browser/node_modules/playwright
        run: python3 -m tools.compose_smoke
      - name: Upload secret-free verification record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compose-verification-${{ github.sha }}
          path: |
            compose-verification.json
            compose-desktop.png
            compose-mobile.png
          retention-days: 7
