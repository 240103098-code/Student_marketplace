[project]
name = "student-marketplace"
version = "0.1.0"
description = "A university-only student marketplace"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
